name: Build & Release

on:
    workflow_dispatch:
        inputs:
            create_release:
                description: "Create a release?"
                required: true
                type: boolean
                default: false

jobs:
    build:
        name: Build (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      target: linux-x64
                      output-name: PriceTrail-linux-x64.AppImage

                    - os: windows-latest
                      target: win-x64
                      output-name: PriceTrail-win-x64.zip

                    - os: macos-latest
                      target: osx-arm64
                      output-name: PriceTrail-macos-arm64.zip
        outputs:
            version: ${{ steps.get_version.outputs.VERSION }}

        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: "10.0.x"

            - name: Restore
              run: dotnet restore

            - name: Publish Application
              shell: bash
              run: |
                  dotnet publish PriceTrail.csproj \
                    -c Release \
                    -r ${{ matrix.target }} \
                    --self-contained true \
                    -o ./publish

            - name: Package Folder Build
              shell: bash
              run: |
                  shopt -s dotglob   # make * globs include dotfiles/dotfolders

                  if [ "${{ matrix.target }}" = "osx-arm64" ]; then
                    # --- MACOS BUILD ---
                    mkdir -p ./publish-pkg/PriceTrail.app/Contents/MacOS
                    cp -R ./publish/* ./publish-pkg/PriceTrail.app/Contents/MacOS/
                    cd ./publish-pkg
                    zip -r ../${{ matrix.output-name }} PriceTrail.app
                  elif [ "${{ matrix.target }}" = "win-x64" ]; then
                    # --- WINDOWS BUILD ---
                    cd ./publish
                    7z a ../${{ matrix.output-name }} *
                  else
                    # --- LINUX BUILD ---
                    mkdir -p PriceTrail.AppDir/usr/bin
                    cp -R ./publish/* PriceTrail.AppDir/usr/bin/

                    echo '#!/bin/sh' > PriceTrail.AppDir/AppRun
                    echo 'SELF=$(dirname "$(readlink -f "$0")")' >> PriceTrail.AppDir/AppRun
                    echo 'exec "$SELF/usr/bin/PriceTrail" "$@"' >> PriceTrail.AppDir/AppRun

                    chmod +x PriceTrail.AppDir/AppRun

                    echo '[Desktop Entry]' > PriceTrail.AppDir/PriceTrail.desktop
                    echo 'Name=PriceTrail' >> PriceTrail.AppDir/PriceTrail.desktop
                    echo 'Exec=PriceTrail' >> PriceTrail.AppDir/PriceTrail.desktop
                    echo 'Icon=PriceTrail' >> PriceTrail.AppDir/PriceTrail.desktop
                    echo 'Type=Application' >> PriceTrail.AppDir/PriceTrail.desktop
                    echo 'Categories=Utility;' >> PriceTrail.AppDir/PriceTrail.desktop

                    cp Assets/Logo/logo_256x256.png PriceTrail.AppDir/PriceTrail.png

                    wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
                    chmod +x appimagetool-x86_64.AppImage

                    # "--appimage-extract-and-run" is used because GitHub runners may not allow FUSE mounts out-of-the-box"
                    ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run PriceTrail.AppDir ../${{ matrix.output-name }}
                  fi

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.output-name }}
                  path: ./${{ matrix.output-name }}

            # Extract version only on the Linux runner to avoid duplicate runs
            - name: Extract Version from .csproj
              if: matrix.os == 'ubuntu-latest'
              id: get_version
              run: |
                  # Finds the <Version> tag, extracts the value, and removes whitespace
                  VERSION=$(grep -oP '(?<=<Version>)[^<]+' *.csproj | head -1 | tr -d '[:space:]')
                  echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT
                  echo "Extracted version: v$VERSION"

    release:
        name: Create GitHub Release
        needs: build
        runs-on: ubuntu-latest
        if: ${{ inputs.create_release == true }}
        permissions:
            contents: write

        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v7
              with:
                  path: release-artifacts
                  merge-multiple: true

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ needs.build.outputs.version }}
                  name: ${{ needs.build.outputs.version }}
                  target_commitish: ${{ github.sha }}
                  body: "Release build"
                  make_latest: true
                  files: |
                      release-artifacts/PriceTrail-linux-x64.AppImage
                      release-artifacts/PriceTrail-win-x64.zip
                      release-artifacts/PriceTrail-macos-arm64.zip
