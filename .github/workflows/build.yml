name: Build & Release

on:
    workflow_dispatch:
        inputs:
            create_release:
                description: "Create a release?"
                required: true
                type: boolean
                default: false

jobs:
    build:
        name: Build (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      target: linux-x64
                      output-name: PriceTrail-linux-x64.AppImage

                    - os: windows-latest
                      target: win-x64
                      output-name: PriceTrail-win-x64.zip

                    - os: macos-latest
                      target: osx-arm64
                      output-name: PriceTrail-macos-arm64.zip
        outputs:
            tag_name: ${{ steps.get_version.outputs.TAG_NAME }}

        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: "10.0.x"

            - name: Restore
              run: dotnet restore

            - name: Extract version from .csproj
              id: get_version
              shell: bash
              run: |
                  # Finds the <Version> tag, extracts the value, and removes whitespace
                  APP_VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' *.csproj | head -1 | tr -d '[:space:]')

                  echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

                  if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
                    echo "TAG_NAME=v$APP_VERSION" >> $GITHUB_OUTPUT
                  fi

            - name: Publish Application
              shell: bash
              run: |
                  dotnet publish PriceTrail.csproj \
                    -c Release \
                    -r ${{ matrix.target }} \
                    --self-contained true \
                    -p:PublishSingleFile=true \
                    -p:DebugType=None \
                    -o ./publish

            - name: Package Folder Build
              shell: bash
              run: |
                  shopt -s dotglob   # make * globs include dotfiles/dotfolders

                  if [ "${{ matrix.target }}" = "osx-arm64" ]; then
                    # --- MACOS BUILD ---
                    APP=./publish-pkg/PriceTrail.app
                    mkdir -p "$APP/Contents/MacOS"
                    mkdir -p "$APP/Contents/Resources"

                    cp -R ./publish/* "$APP/Contents/MacOS/"
                    chmod +x "$APP/Contents/MacOS/PriceTrail"

                    cp Assets/Logo/logo.icns "$APP/Contents/Resources/AppIcon.icns"

                    cat << EOF > "$APP/Contents/Info.plist"
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                      <key>CFBundleExecutable</key>
                      <string>PriceTrail</string>
                      <key>CFBundleIdentifier</key>
                      <string>com.cral0202.pricetrail</string>
                      <key>CFBundleName</key>
                      <string>PriceTrail</string>
                      <key>CFBundleIconFile</key>
                      <string>AppIcon</string>
                      <key>CFBundlePackageType</key>
                      <string>APPL</string>
                      <key>CFBundleShortVersionString</key>
                      <string>$APP_VERSION</string>
                      <key>CFBundleVersion</key>
                      <string>$APP_VERSION</string>
                      <key>LSMinimumSystemVersion</key>
                      <string>14.0</string>
                      <key>NSHighResolutionCapable</key>
                      <true/>
                  </dict>
                  </plist>
                  EOF

                    # Ad-hoc sign
                    find "$APP" -type f \( -perm -u+x -o -name "*.dylib" \) -exec codesign --force --sign - {} \;
                    codesign --force --sign - "$APP"
                    codesign --verify --strict --verbose=2 "$APP"

                    cd ./publish-pkg
                    zip -r ../${{ matrix.output-name }} PriceTrail.app
                  elif [ "${{ matrix.target }}" = "win-x64" ]; then
                    # --- WINDOWS BUILD ---
                    cd ./publish
                    7z a ../${{ matrix.output-name }} *
                  else
                    # --- LINUX BUILD ---
                    mkdir -p PriceTrail.AppDir/usr/bin
                    cp -R ./publish/* PriceTrail.AppDir/usr/bin/

                    cat << 'EOF' > PriceTrail.AppDir/AppRun
                  #!/bin/sh
                  SELF=$(dirname "$(readlink -f "$0")")
                  exec "$SELF/usr/bin/PriceTrail" "$@"
                  EOF

                    chmod +x PriceTrail.AppDir/AppRun

                    cat << 'EOF' > PriceTrail.AppDir/PriceTrail.desktop
                  [Desktop Entry]
                  Name=PriceTrail
                  Exec=PriceTrail
                  Icon=PriceTrail
                  Type=Application
                  Categories=Utility;
                  EOF

                    cp Assets/Logo/logo_256x256.png PriceTrail.AppDir/PriceTrail.png

                    wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
                    chmod +x appimagetool-x86_64.AppImage

                    # "--appimage-extract-and-run" is used because GitHub runners may not allow FUSE mounts out-of-the-box"
                    ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run PriceTrail.AppDir ./${{ matrix.output-name }}
                  fi

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.output-name }}
                  path: ./${{ matrix.output-name }}

    release:
        name: Create GitHub Release
        needs: build
        runs-on: ubuntu-latest
        if: ${{ inputs.create_release == true }}
        permissions:
            contents: write

        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v7
              with:
                  path: release-artifacts
                  merge-multiple: true

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ needs.build.outputs.tag_name }}
                  name: ${{ needs.build.outputs.tag_name }}
                  target_commitish: ${{ github.sha }}
                  body: "Release build"
                  make_latest: true
                  files: |
                      release-artifacts/PriceTrail-linux-x64.AppImage
                      release-artifacts/PriceTrail-win-x64.zip
                      release-artifacts/PriceTrail-macos-arm64.zip
