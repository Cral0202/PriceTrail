name: Build

on:
    workflow_dispatch:

jobs:
    build-linux:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: "10.0.x"

            - name: Restore
              run: dotnet restore

            - name: Publish Linux x64
              run: |
                  dotnet publish \
                    -c Release \
                    -r linux-x64 \
                    --self-contained true \
                    -p:PublishSingleFile=true \
                    -p:IncludeNativeLibrariesForSelfExtract=true

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: PriceTrail-linux-x64
                  path: bin/Release/net10.0/linux-x64/publish/

            - name: Extract Version from .csproj
              id: get_version
              run: |
                  # Finds the <Version> tag, extracts the value, and removes whitespace
                  VERSION=$(grep -oP '(?<=<Version>)[^<]+' *.csproj | head -1 | tr -d '[:space:]')
                  echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT
                  echo "Extracted version: v$VERSION"

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.get_version.outputs.VERSION }}
                  name: Release ${{ steps.get_version.outputs.VERSION }}
                  draft: false
                  prerelease: false
                  files: |
                      bin/Release/net10.0/linux-x64/publish/*
