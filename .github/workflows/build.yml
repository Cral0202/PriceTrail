name: Build & Release

on:
    workflow_dispatch:

jobs:
    build:
        name: Build (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      target: linux-x64
                      binary-name: PriceTrail
                      output-name: PriceTrail-linux-x64

                    - os: windows-latest
                      target: win-x64
                      binary-name: PriceTrail.exe
                      output-name: PriceTrail-win-x64.exe

                    - os: macos-latest
                      target: osx-arm64
                      binary-name: PriceTrail
                      output-name: PriceTrail-macos-arm64.zip

        outputs:
            version: ${{ steps.get_version.outputs.VERSION }}

        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: "10.0.x"

            - name: Restore
              run: dotnet restore

            - name: Publish Application
              shell: bash
              run: |
                  dotnet publish \
                    -c Release \
                    -r ${{ matrix.target }} \
                    --self-contained true \
                    -p:PublishSingleFile=true \
                    -p:IncludeNativeLibrariesForSelfExtract=true \
                    -o ./publish

            - name: Rename/Package Binary
              shell: bash
              run: |
                  if [ "${{ matrix.target }}" = "osx-arm64" ]; then
                    mkdir -p ./publish/PriceTrail.app/Contents/MacOS
                    mv ./publish/PriceTrail ./publish/PriceTrail.app/Contents/MacOS/PriceTrail
                    cd ./publish
                    zip -r ${{ matrix.output-name }} PriceTrail.app
                    rm -rf PriceTrail.app
                  else
                    # Standard rename for Windows/Linux
                    mv ./publish/${{ matrix.binary-name }} ./publish/${{ matrix.output-name }}
                  fi

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.output-name }}
                  path: ./publish/${{ matrix.output-name }}

              # Extract version only on the Linux runner to avoid duplicate runs
            - name: Extract Version from .csproj
              if: matrix.os == 'ubuntu-latest'
              id: get_version
              run: |
                  # Finds the <Version> tag, extracts the value, and removes whitespace
                  VERSION=$(grep -oP '(?<=<Version>)[^<]+' *.csproj | head -1 | tr -d '[:space:]')
                  echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT
                  echo "Extracted version: v$VERSION"

    release:
        name: Create GitHub Release
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v7
              with:
                  path: release-artifacts
                  merge-multiple: true

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ needs.build.outputs.version }}
                  name: ${{ needs.build.outputs.version }}
                  target_commitish: ${{ github.sha }}
                  body: "Release build"
                  make_latest: true
                  files: |
                      release-artifacts/PriceTrail-linux-x64
                      release-artifacts/PriceTrail-win-x64.exe
                      release-artifacts/PriceTrail-macos-arm64.zip
